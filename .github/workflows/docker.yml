name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image names
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'latest=%s:latest\nrevision=%s:sha-%s\n' "$image" "$image" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build Linux image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.image.outputs.latest }}
            ${{ steps.image.outputs.revision }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Verify container before publishing
        env:
          IMAGE: ${{ steps.image.outputs.revision }}
        run: |
          password="$(openssl rand -hex 24)"
          container="$(docker run --detach --publish 127.0.0.1::8080 --volume /data \
            --env "HGHUBX_WEB_PASSWORD=$password" "$IMAGE")"
          trap 'docker logs "$container"; docker rm -fv "$container"' EXIT
          url="http://$(docker port "$container" 8080/tcp)"
          curl --fail --silent --show-error --max-time 3 --retry 20 --retry-all-errors --retry-delay 1 "$url/healthz"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$url/")" = 401
          curl --fail --silent --show-error --user "admin:$password" "$url/" | grep -q '<title>HGhubX</title>'
          docker exec "$container" test -w /data/state

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish both tags
        env:
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_LATEST: ${{ steps.image.outputs.latest }}
        run: |
          docker push "$IMAGE_REVISION"
          docker push "$IMAGE_LATEST"
